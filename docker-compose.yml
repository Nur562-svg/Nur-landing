services:
  # === 生产数据库 ===
  db:
    image: postgres:16-alpine
    container_name: nur-learn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nur_learn}
      POSTGRES_USER: ${POSTGRES_USER:-nur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nur} -d ${POSTGRES_DB:-nur_learn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === 反向代理（自动 HTTPS） ===
  caddy:
    image: caddy:2-alpine
    container_name: nur-learn-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # === 应用 ===
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: nur-learn:latest
    container_name: nur-learn
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # DATABASE_URL provided via env_file (.env.local recommended for prod with full postgres URL incl. password)
      # Example in .env.local: DATABASE_URL=postgresql://nur:strongpass@db:5432/nur_learn?schema=public
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # === 开发环境 ===
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nur-learn:dev
    container_name: nur-learn-dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
